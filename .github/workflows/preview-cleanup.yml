name: Preview Cleanup

# Deletes a PR's preview channel (pr-<N> on the dev site) when the PR is closed
# or merged, instead of leaving it live until Firebase expires it (E01-S07,
# D-21). A PR that never got a channel (docs-only, or previews were off) is a
# no-op. Same guards as the preview job in ci.yml: same-repo PRs only, and
# skipped until the keyless-auth repo variables are set.

on:
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}

permissions:
  contents: read
  id-token: write

jobs:
  delete:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Delete preview channel
        run: ./scripts/deploy.sh preview-delete "pr-${{ github.event.pull_request.number }}"
