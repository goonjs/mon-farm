name: CI

# docs/process.md: every push and PR must run build, unit tests and lint, and a
# red pipeline blocks merge. The order below is deliberate -- the cheapest gates
# that catch the most common breakage run first, so a token drift or a type
# error fails in seconds rather than after a five-minute browser download.

#
# Triggers: a branch with a PR is verified by the pull_request run alone, and
# the long-lived branches (dev, where work lands, and main) are verified again
# on merge. Running on push to every branch as well
# doubled every PR's minutes, since the two runs never shared a concurrency
# group (owner rule 2026-10-02: save Actions minutes).
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheapest gate, so it goes first: Conventional Commits are what the
      # Deploy Prod workflow computes the version bump and changelog from.
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: >
          node scripts/release.mjs lint
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Design tokens have two consumers: the app imports design/tokens.ts, and
      # the docs/ux prototypes import the generated tokens.css. This is what
      # stops them drifting -- change a token without regenerating and CI is red.
      - name: Tokens are in sync with their source
        run: npm run tokens:check

      # "High contrast" is a claim about a palette, and a claim about a palette
      # is checkable. Fails if any pairing drops below its required ratio.
      - name: Contrast ratios hold
        run: npm run contrast

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Pure money model. No React Native transform in the path, so this is the
      # fastest and highest-value suite in the project.
      - name: Core tests
        run: npm run test:core

      - name: Component tests
        run: npm run test:ui

      # Doubles as the build gate: a bundling failure exits non-zero here rather
      # than turning into a blank screenshot in the e2e job.
      - name: Build web
        run: npm run build:web

      # Handed to the preview job so the PR is built once, not twice.
      - name: Keep the web build for the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/ux/screenshots/
          if-no-files-found: warn

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results/

  # A live URL per PR on the dev site; Firebase deletes the channel after 7
  # days. Skipped for forks, which get no OIDC token and must not reach the
  # deploy credential.
  preview:
    needs: verify
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy preview channel (expires in 7 days)
        run: ./scripts/deploy.sh preview "pr-${{ github.event.pull_request.number }}" | tee preview.log

      - name: Show the preview URL
        run: |
          url=$(grep -Eo 'https://[^ ]+\.web\.app[^ ]*' preview.log | head -1)
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
