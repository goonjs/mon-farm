name: CI

# docs/process.md: every push and PR must run build, unit tests and lint, and a
# red pipeline blocks merge. The order below is deliberate -- the cheapest gates
# that catch the most common breakage run first, so a token drift or a type
# error fails in seconds rather than after a five-minute browser download.
#
# Graph (E01-S05): changes -> verify -> e2e, strictly sequential, so a red
# step stops everything after it. A docs-only change stops at `changes`:
# verify and e2e report "skipped", which branch protection counts as passing,
# so a required check never blocks a docs PR.

#
# Triggers: a branch with a PR is verified by the pull_request run alone, and
# the long-lived branches (dev, where work lands, and main) are verified again
# on merge. Running on push to every branch as well
# doubled every PR's minutes, since the two runs never shared a concurrency
# group (owner rule 2026-10-02: save Actions minutes).
#
# Minutes (E01-S17): a PR runs the cheap gates only (changes + verify). The
# browser suite (e2e) runs after merge on dev/main, and on a PR only when it
# carries the `e2e` label; the PR preview is label-driven too. Both live in
# pr-extras.yml so that adding a label never re-runs this workflow. Draft PRs
# run nothing until they are marked ready. The Firestore rules tests (JDK +
# emulator) run on a PR only when rules, tooling or dependencies changed.
on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Only PR runs cancel each other. A push run on dev/main must finish: the next
# push diffs from its own `before`, so a cancelled code merge followed by a
# docs merge would otherwise never be verified. Push runs are grouped per
# commit, not per branch: GitHub keeps one *pending* run per group and drops
# the older one even without cancel-in-progress (#30's merge run was dropped
# that way behind a docs merge, run 131).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No install: plain git plus the runner's preinstalled node, so a docs-only
  # PR costs one billed minute instead of a full build.
  changes:
    # A draft PR is skipped (counts as passing); ready_for_review starts it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      rules: ${{ steps.diff.outputs.rules }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheapest gate, so it goes first: Conventional Commits are what the
      # Deploy Prod workflow computes the version bump and changelog from.
      # Docs commits are versioned too, so this runs for docs-only PRs.
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: >
          node scripts/release.mjs lint
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Classify changed files
        id: diff
        run: >
          node scripts/ci-changes.mjs
          ${{ github.event.pull_request.base.sha || github.event.before }}
          ${{ github.sha }} >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Design tokens have two consumers: the app imports design/tokens.ts, and
      # the docs/ux prototypes import the generated tokens.css. This is what
      # stops them drifting -- change a token without regenerating and CI is red.
      - name: Tokens are in sync with their source
        run: npm run tokens:check

      # "High contrast" is a claim about a palette, and a claim about a palette
      # is checkable. Fails if any pairing drops below its required ratio.
      - name: Contrast ratios hold
        run: npm run contrast

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Pure money model. No React Native transform in the path, so this is the
      # fastest and highest-value suite in the project.
      - name: Core tests
        run: npm run test:core

      - name: Component tests
        run: npm run test:ui

      # Firestore security rules on the emulator (E01-S08). The emulator is a
      # Java program (firebase-tools needs JDK 21+) and a ~60 MB download, so
      # both the JDK and the JAR are cached.
      - uses: actions/setup-java@v4
        if: github.event_name == 'push' || needs.changes.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firestore emulator
        if: github.event_name == 'push' || needs.changes.outputs.rules == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # On a PR this runs only when scripts/ci-changes.mjs says rules, tooling
      # or dependencies changed; after merge it always runs.
      - name: Firestore rules tests
        if: github.event_name == 'push' || needs.changes.outputs.rules == 'true'
        run: npm run test:rules

      # Doubles as the build gate: a bundling failure exits non-zero here rather
      # than turning into a blank screenshot in the e2e job.
      - name: Build web
        run: npm run build:web

      # e2e tests this exact bundle instead of building it a second time. Only
      # pushes have an e2e job, so a PR skips the upload.
      - name: Upload web build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # The export ships _expo/.routes.json; keep the artifact identical.
          include-hidden-files: true
          retention-days: 1

  # After merge only (dev/main). On a PR, add the `e2e` label (pr-extras.yml).
  e2e:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Still needed for @playwright/test and the config's design/tokens import.
      - name: Install
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Keyed on the lockfile's resolved Playwright version, so a cache hit is
      # always the browser build that version expects.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser only; its system libraries live outside it.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/ux/screenshots/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results/
          # The folder itself is hidden; v4 would otherwise upload nothing (#45).
          include-hidden-files: true
