name: Deploy Dev

# Every push to dev (merged PRs, and the release commit Deploy Prod writes back)
# goes to the dev site. PRs were already verified by CI before they merged, so
# this builds and deploys only -- no second test run (Actions minutes).
#
# E01-S17: cloudbuild.yaml + docs/runbooks/cloud-build-deploy-dev.md are an
# optional way to move this off GitHub Actions if the repo goes private again
# and minutes run short. Until a Cloud Build trigger exists, this stays the
# automatic deploy (owner, 2026-10-14: setup was blocked, repo made public).
#
# Keyless: GitHub's OIDC token is exchanged for a short-lived Google
# credential. The two repo *variables* below are identifiers, not secrets.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        env:
          # Public web config for project mon-farmmate (not secrets; E02-S01).
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: mon-farmmate
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyA2LpIyAf0Sae1q0O5I1mRTb75AEv6hPwY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: mon-farmmate.firebaseapp.com
        run: npm run build:web

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to dev
        run: ./scripts/deploy.sh dev
