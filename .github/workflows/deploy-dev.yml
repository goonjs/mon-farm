name: Deploy Dev

# MANUAL FALLBACK (E01-S17). The automatic dev deploy moved to Google Cloud
# Build (cloudbuild.yaml, trigger on push to dev) to save GitHub Actions
# minutes -- see docs/runbooks/cloud-build-deploy-dev.md. This workflow stays
# so a dev deploy can still be started by hand from the Actions tab if the
# Cloud Build trigger is down or not set up yet. It builds and deploys only --
# no test run.
#
# Keyless: GitHub's OIDC token is exchanged for a short-lived Google
# credential. The two repo *variables* below are identifiers, not secrets.

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        env:
          # Public web config for project mon-farmmate (not secrets; E02-S01).
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: mon-farmmate
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyA2LpIyAf0Sae1q0O5I1mRTb75AEv6hPwY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: mon-farmmate.firebaseapp.com
        run: npm run build:web

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to dev
        run: ./scripts/deploy.sh dev
