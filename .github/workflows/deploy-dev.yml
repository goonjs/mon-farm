name: Deploy Dev

# Every push to dev (merged PRs, and the release commit Deploy Prod writes back)
# goes to the dev site. PRs were already verified by CI before they merged, so
# this builds and deploys only -- no second test run (Actions minutes).
#
# Keyless: GitHub's OIDC token is exchanged for a short-lived Google
# credential. The two repo *variables* below are identifiers, not secrets.

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        run: npm run build:web

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to dev
        run: ./scripts/deploy.sh dev
