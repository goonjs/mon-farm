# Posts an agent message to Discord from a GitHub runner, which holds the webhook secrets.
# Agents in a Claude Remote session cannot read secrets, so scripts/notify.sh starts this workflow
# (`gh workflow run discord-notify.yml -f channel=... -f message=...`) when no URL is set locally.
# workflow_dispatch only works once this file is on the repo's default branch (standards 04).
# Needs scripts/notify.sh (a copy of dev-pose tools/discord/notify.sh) and the three secrets
# DISCORD_WEBHOOK_AI_UPDATES, DISCORD_WEBHOOK_AI_ALERTS, DISCORD_WEBHOOK_PLAYGROUND.
name: discord-notify

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to post to
        type: choice
        required: true
        options: [updates, alerts, playground]
      need:
        description: "alerts only: decision, review or blocked"
        type: string
        required: false
      mention:
        description: "alerts only: numeric Discord user id to mention"
        type: string
        required: false
      message:
        description: Message text (plain text, 2000 characters at most)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: discord-notify
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Post to Discord
        env:
          # Inputs go through the environment, never into the script text (no injection).
          CHANNEL: ${{ inputs.channel }}
          NEED: ${{ inputs.need }}
          MENTION: ${{ inputs.mention }}
          MESSAGE: ${{ inputs.message }}
          DISCORD_WEBHOOK_AI_UPDATES: ${{ secrets.DISCORD_WEBHOOK_AI_UPDATES }}
          DISCORD_WEBHOOK_AI_ALERTS: ${{ secrets.DISCORD_WEBHOOK_AI_ALERTS }}
          DISCORD_WEBHOOK_PLAYGROUND: ${{ secrets.DISCORD_WEBHOOK_PLAYGROUND }}
        run: |
          args=()
          [ -n "$NEED" ] && args+=(--need "$NEED")
          [ -n "$MENTION" ] && args+=(--mention "$MENTION")
          bash scripts/notify.sh "$CHANNEL" "${args[@]}" -- "$MESSAGE"
