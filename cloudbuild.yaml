# Deploys the dev site on every push to `dev` (E01-S17). Runs on Google Cloud
# Build, so it uses the Cloud Build free tier (2,500 build-minutes/month on the
# default e2-standard-2 pool) instead of GitHub Actions minutes.
#
# Trigger and permissions are one-time console/gcloud setup:
# docs/runbooks/cloud-build-deploy-dev.md. Auth needs no key: the build runs as
# the trigger's service account and firebase-tools picks up its credentials
# from the metadata server.
#
# Same two commands CI runs (npm ci, build:web) and the same scripts/deploy.sh,
# so a local run, the manual deploy-dev.yml fallback and this build deploy
# identically. Production is NOT deployed from here: Deploy Prod stays the only
# way to the prod site.
steps:
  - id: install
    name: node:22
    entrypoint: npm
    args: ['ci']

  - id: build
    name: node:22
    entrypoint: npm
    args: ['run', 'build:web']
    env:
      # Public web config for project mon-farmmate (not secrets; E02-S01). Keep
      # in step with deploy-dev.yml.
      - EXPO_PUBLIC_FIREBASE_PROJECT_ID=mon-farmmate
      - EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyA2LpIyAf0Sae1q0O5I1mRTb75AEv6hPwY
      - EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=mon-farmmate.firebaseapp.com

  - id: deploy
    name: node:22
    entrypoint: bash
    args: ['scripts/deploy.sh', 'dev']

# Required when a build runs as a user-specified service account.
options:
  logging: CLOUD_LOGGING_ONLY

timeout: 900s
