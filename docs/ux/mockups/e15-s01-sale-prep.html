:root{--pg:#E9EEF3;}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans Thai","Sarabun",ui-sans-serif,system-ui,sans-serif;background:var(--pg);color:var(--color-ink);padding:32px 20px 80px;line-height:1.45}
.page{max-width:1280px;margin:0 auto}
h1{font-size:28px;margin-bottom:6px}
.lead{color:var(--color-ink-soft);max-width:860px;margin-bottom:20px}
section.doc{background:#fff;border-radius:16px;padding:20px 24px;margin:16px 0;box-shadow:0 2px 12px rgba(0,40,88,.06)}
section.doc h2{font-size:20px;margin-bottom:8px}
section.doc p,section.doc li{font-size:14px;color:var(--color-ink-soft)}
section.doc ul{padding-left:20px;display:grid;gap:4px}
section.doc b{color:var(--color-ink)}
table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.cmp td,table.cmp th{border-bottom:1px solid var(--color-rule-faint);padding:8px;text-align:left;vertical-align:top}
.row-flow{display:flex;flex-wrap:wrap;gap:36px 28px;margin:16px 0}
figure.fig{width:390px}
figure.fig figcaption{margin-top:10px;font-size:14px;color:var(--color-ink-soft);max-width:390px}
figure.fig figcaption .t{display:block;font-weight:700;color:var(--color-ink);font-size:14px;margin-bottom:2px}
figure.fig figcaption .ids{display:block;margin-top:4px;font-size:12px;color:var(--color-ink-faint)}
.band{font-weight:700;font-size:18px;margin:28px 0 4px;display:flex;gap:10px;align-items:center}
.band span{background:var(--color-ink);color:var(--color-ink-inverse);border-radius:999px;padding:2px 12px;font-size:14px}

/* ---- phone ---- */
.phone{width:390px;height:844px;background:var(--color-surface);position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:0;outline:1px solid var(--color-rule);font-size:16px}
.appbar{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;flex:none;background:var(--color-app-bar);color:var(--color-app-bar-ink)}
.appbar .ib{width:48px;height:48px;display:grid;place-items:center}
.appbar h3{flex:1;font-size:20px;font-weight:700;line-height:1.2}
.appbar h3 small{display:block;font-size:13px;font-weight:400;color:var(--color-ink-soft)}
.sync{display:inline-flex;align-items:center;gap:6px;background:var(--color-accept-sunk);color:var(--color-accept);font-weight:600;font-size:13px;border-radius:999px;padding:5px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--color-accept)}
.body{flex:1;padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-height:0}
.foot{flex:none;padding:10px 16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--color-surface)}
.card{background:var(--color-surface-raised);border:1px solid var(--color-rule-faint);border-radius:16px;box-shadow:0 2px 12px rgba(0,40,88,.06);padding:14px}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.tile.sm{width:40px;height:40px;border-radius:12px}
.t-cream{background:var(--color-brand-cream)}.t-green{background:var(--color-accept-sunk)}.t-blue{background:var(--color-action-sunk)}.t-sunk{background:var(--color-surface-sunk)}.t-warn{background:var(--color-warn-sunk)}
.fm{display:block;object-fit:contain}
.cap{font-size:14px;color:var(--color-ink-soft)}
.val{font-weight:700}
.money{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sec{display:flex;align-items:baseline;justify-content:space-between;font-weight:700;font-size:16px;padding:2px 2px 0}
.sec small{font-weight:500;font-size:13px;color:var(--color-ink-soft)}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;background:var(--color-action);color:var(--color-ink-inverse)}
.btn.sec2{background:transparent;color:var(--color-action);border:2px solid var(--color-action);box-shadow:none}
.btn.dis{background:var(--color-disabled-fill);color:var(--color-disabled-ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--color-action);box-shadow:none;height:48px;font-size:16px}
.btn.green{background:var(--color-accept)}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.dashed{border:2px dashed var(--color-rule-strong);background:transparent;box-shadow:none;border-radius:16px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--color-action);font-size:16px}
.fields{display:flex;gap:10px}
.field{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px;min-width:0}
.field .ico{color:var(--color-ink-soft);flex:none}
.field .tx{flex:1;min-width:0}.field .tx .val{font-size:16px;line-height:1.3}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px}
.item .tx{flex:1;min-width:0}
.item .tx .val{font-size:16px;line-height:1.3}
.item .amt{text-align:right}
.item .amt .money{font-size:18px}
.paycard{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
.paycard .ico{width:40px;height:40px;border-radius:12px;background:var(--color-action-sunk);color:var(--color-action);display:grid;place-items:center;flex:none}
.totalbar{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.totalbar .money{font-size:28px}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,40,88,.48)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-surface);border-radius:24px 24px 0 0;padding:8px 16px 18px;display:flex;flex-direction:column;gap:12px;max-height:94%;overflow:hidden;box-shadow:0 -6px 24px rgba(0,40,88,.14)}
