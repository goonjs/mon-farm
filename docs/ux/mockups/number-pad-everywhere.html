<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แป้นตัวเลขของแอปทุกช่อง (E01-S20)</title><link rel="stylesheet" href="../tokens.css"><style>
:root{--pg:#E9EEF3;}

/* ---- phone ---- */

.totalbar{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,40,88,.48)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-surface);border-radius:24px 24px 0 0;padding:8px 16px 18px;display:flex;flex-direction:column;gap:12px;max-height:94%;overflow:hidden;box-shadow:0 -6px 24px rgba(0,40,88,.14)}

.sheethead{display:flex;align-items:flex-start;gap:8px}
.sheethead h4{flex:1}
.sheethead .x{width:48px;height:48px;display:grid;place-items:center;color:var(--color-ink-soft);margin:-6px -8px 0 0}

.radio.on{border-color:var(--color-action);background:var(--color-action);color:var(--color-ink-inverse)}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--color-rule-strong);flex:none;display:grid;place-items:center;background:var(--color-surface-raised)}
.box.on{background:var(--color-accept);border-color:var(--color-accept);color:var(--color-ink-inverse)}
.seg{display:flex;background:var(--color-surface-sunk);border-radius:999px;padding:4px;gap:4px}

.seg span.on{background:var(--color-action);color:var(--color-ink-inverse)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.sbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--color-action);color:var(--color-action);display:grid;place-items:center;flex:none;background:var(--color-surface-raised)}
.sbtn.sm{width:48px;height:48px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:60px;border-radius:16px;background:var(--color-surface-raised);border:1px solid var(--color-rule-faint);box-shadow:0 2px 6px rgba(0,40,88,.06);display:grid;place-items:center;font-size:28px;font-weight:700}.key.act{background:var(--color-action);color:var(--color-ink-inverse)}.key.fn{background:var(--color-surface-sunk);font-size:20px;color:var(--color-ink-soft)}
.hint{font-size:14px;color:var(--color-ink-soft)}

.numbox span{font-size:14px;color:var(--color-ink-soft);font-weight:600;align-self:center}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid var(--color-rule-strong);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;background:var(--color-surface-raised)}

.totalcard{display:flex;align-items:center;gap:12px;background:var(--color-accept-sunk);border-radius:16px;padding:12px 16px}
.totalcard .money{font-size:28px;margin-left:auto;color:var(--color-ink)}
.tick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--color-accept-sunk);border:1.5px solid var(--color-accept)}
.tick.off{background:var(--color-surface-raised);border-color:var(--color-rule)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}

/* detail chips */
.prog{height:10px;border-radius:999px;background:var(--color-surface-sunk);overflow:hidden}

.dchip.done{border:2px solid var(--color-accept);background:var(--color-accept-sunk);border-style:solid}
.dchip.done .v{color:var(--color-accept)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.b-ok{background:var(--color-accept-sunk);color:var(--color-accept)}
.b-warn{background:var(--color-warn-sunk);color:var(--color-warn)}

.rowx{display:flex;align-items:center;gap:12px}
.sumbar{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;background:var(--color-surface-sunk)}
.sumbar.ok{background:var(--color-accept-sunk)}.sumbar.warn{background:var(--color-warn-sunk)}

.tcard{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cover{height:110px;border-radius:16px;background:linear-gradient(180deg,var(--color-action-sunk),var(--color-accept-sunk) 60%,var(--color-brand) 60%);position:relative;overflow:hidden}

.acts{display:flex;gap:8px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;font-weight:700;font-size:14px;text-align:center}
.mod{display:flex;align-items:center;gap:10px;padding:10px 12px;flex:1;min-width:0;font-weight:700;font-size:14px}
.rowline{display:flex;align-items:center;gap:12px;padding:12px 14px}

.ruler{height:92px;border-radius:14px;background:var(--color-surface-sunk);position:relative;overflow:hidden}

.r{text-align:right}
